<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E03100"/>
    </linearGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <!-- Orange background with squircle corners -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- White K Letter for KitchenFlow -->
  <g fill="none" stroke="url(#kGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical stem -->
    <path d="M 170 128 V 384" stroke-width="58"/>
    <!-- Upper diagonal arm -->
    <path d="M 195 260 L 345 128" stroke-width="58"/>
    <!-- Lower diagonal arm -->
    <path d="M 215 235 L 350 384" stroke-width="58"/>
  </g>
  
  <!-- Sparkle accent dot on top right -->
  <circle cx="395" cy="116" r="20" fill="#FFD400"/>
</svg>
