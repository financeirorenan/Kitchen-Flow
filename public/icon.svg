<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E03100"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded squircle corners -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Stylized N Letter for Nova Delivery -->
  <g fill="none" stroke="url(#nGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left vertical bar -->
    <path d="M 148 128 V 384" stroke-width="52"/>
    <!-- Diagonal connection -->
    <path d="M 148 138 L 364 374" stroke-width="56"/>
    <!-- Right vertical bar -->
    <path d="M 364 128 V 384" stroke-width="52"/>
  </g>
  
  <!-- Little fast-delivery spark dot accent on top-right of N -->
  <circle cx="400" cy="116" r="22" fill="#FFD400"/>
</svg>
